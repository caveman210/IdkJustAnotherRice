"$schema" = 'https://starship.rs/config-schema.json'

# Earthy Theme Palette
palette = "earthy"

[palettes.earthy]
# Standard colors
blue      = "#A68C8A"
red       = "#40170E"
green     = "#594347"
yellow    = "#D9CCCC"
cyan      = "#A68C8A"
magenta   = "#594347"
white     = "#D9CCCC"
black     = "#0D0D0D"

# Extended palette
rosewater = "#D9CCCC"
flamingo  = "#A68C8A"
pink      = "#594347"
mauve     = "#40170E"
maroon    = "#40170E"
peach     = "#D9CCCC"
teal      = "#594347"
sky       = "#A68C8A"
sapphire  = "#594347"
lavender  = "#40170E"

# Text shades
text      = "#D9CCCC"
subtext1  = "#A68C8A"
subtext0  = "#594347"

# Surface shades
overlay2  = "#594347"
overlay1  = "#A68C8A"
overlay0  = "#40170E"
surface2  = "#40170E"
surface1  = "#0D0D0D"
surface0  = "#0D0D0D"
base      = "#0D0D0D"
mantle    = "#0D0D0D"
crust     = "#40170E"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold blue)"
# vimcmd_symbol = "[❯](bold blue)"

[bun]
format = "via []($style)"

[buf]
format = "with [⎈]($style)"

