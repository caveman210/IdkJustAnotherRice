"$schema" = 'https://starship.rs/config-schema.json'

format = "$os $all"

# ------------------------------------------------------------------------------
# SYSTEM & OS
# ------------------------------------------------------------------------------

[os]
disabled = false
style = "bold #cba6f7"
format = "[$symbol]($style)"

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = "󰌽 "
Mabox = " "
Macos = "󰀵 "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = "󰕈 "
Unknown = " "
Void = " "
Windows = "󰍲 "

[username]
style_user = "bold #cba6f7"
style_root = "bold #f38ba8"

[hostname]
ssh_symbol = " "

# ------------------------------------------------------------------------------
# DIRECTORY & GIT
# ------------------------------------------------------------------------------

[directory]
read_only = " 󰌾"
style = "bold #f9e2af"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = " "
style = "bold #a6e3a1"

[git_status]
style = "bold #a6e3a1"

[git_commit]
tag_symbol = '  '

# ------------------------------------------------------------------------------
# PROGRAMMING LANGUAGES
# Style: Blue (#89b4fa)
# Format: "via [ICON]" (Hides version number for a cleaner look)
# ------------------------------------------------------------------------------

