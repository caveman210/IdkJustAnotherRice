# ------------------------------------------------------------------------------
# SYSTEM STATS & PROMPT
# ------------------------------------------------------------------------------

[time]
disabled = false
time_format = "%R"
style = "bold #cdd6f4"

[memory_usage]
disabled = false
symbol = "󰍛 "
style = "bold #cdd6f4"
format = "[$symbol]($style)"

[battery]
disabled = false
format = "[$symbol $percentage ]($style)"

[[battery.display]]
threshold = 100
discharging_symbol = "󰁹"
charging_symbol = "󰂄"
style = "bold #a6e3a1"

[[battery.display]]
threshold = 90
style = "bold #a6e3a1"
discharging_symbol = "󰂂"
charging_symbol = "󰂄"

