# XCursor (this is what actually works with your themes)
env = XCURSOR_THEME,catppuccin-mocha-light-cursors
env = XCURSOR_SIZE,28

# Make GTK apps follow it too
exec-once = gsettings set org.gnome.desktop.interface cursor-theme catppuccin-mocha-light-cursors
exec-once = gsettings set org.gnome.desktop.interface cursor-size 28


